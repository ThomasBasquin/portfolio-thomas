name: CI

on:
  push:
    branches: [main]
    tags: ['deploy-*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  deploy:
    needs: check
    if: startsWith(github.ref, 'refs/tags/deploy-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a tag outside main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Ship to the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz "$GITHUB_SHA" \
            | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes deploy@116.203.59.27 "$GITHUB_REF_NAME $GITHUB_SHA"
